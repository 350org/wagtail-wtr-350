{% load i18n %}
{% if link_page %}
    <a href="{{ link_page.url }}"
       class="wtr-btn
              {% if style == 'secondary' %}wtr-btn-secondary hover:bg-secondary-700
              {% elif style == 'outline' %}wtr-btn-outline hover:bg-primary-50
              {% elif style == 'outline-light' %}wtr-btn-outline-light hover:bg-white/10
              {% elif style == 'urgent' %}wtr-btn-urgent hover:opacity-90
              {% else %}hover:bg-primary-500{% endif %}
              {% if size == 'lg' %}wtr-btn-lg{% endif %}">
        {{ text }}
    </a>
{% elif link_url %}
    <a href="{{ link_url }}"
       rel="noopener noreferrer"
       class="wtr-btn
              {% if style == 'secondary' %}wtr-btn-secondary hover:bg-secondary-700
              {% elif style == 'outline' %}wtr-btn-outline hover:bg-primary-50
              {% elif style == 'outline-light' %}wtr-btn-outline-light hover:bg-white/10
              {% elif style == 'urgent' %}wtr-btn-urgent hover:opacity-90
              {% else %}hover:bg-primary-500{% endif %}
              {% if size == 'lg' %}wtr-btn-lg{% endif %}">
        {{ text }}
    </a>
{% elif anchor %}
    {# Same-page jump link — see ButtonBlock.anchor. No rel needed: it never leaves the page. #}
    <a href="#{{ anchor }}"
       class="wtr-btn
              {% if style == 'secondary' %}wtr-btn-secondary hover:bg-secondary-700
              {% elif style == 'outline' %}wtr-btn-outline hover:bg-primary-50
              {% elif style == 'outline-light' %}wtr-btn-outline-light hover:bg-white/10
              {% elif style == 'urgent' %}wtr-btn-urgent hover:opacity-90
              {% else %}hover:bg-primary-500{% endif %}
              {% if size == 'lg' %}wtr-btn-lg{% endif %}">
        {{ text }}
    </a>
{% endif %}
