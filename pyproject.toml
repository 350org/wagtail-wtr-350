[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-wtr"
version = "0.1.0"
description = "Wagtail CMS platform for campaign, nonprofit, and organizer websites"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "wagtail>=7.1,<7.3",
    "wagtail-localize>=1.9,<2.0",
    "wagtailmedia",
    "dj-database-url",
    "psycopg[binary]",
    "python-dotenv",
    "whitenoise",
    "gunicorn",
    "django-storages[s3]",
    "wagtail-storages",
    "requests",
    "beautifulsoup4",
    "wagtail-ai>=3.1,<4.0",
    "llm-anthropic>=0.27,<0.28",
    "wagtail-2fa>=1.8,<2.0",
    # wagtail-2fa's TokenForm (the login form behind /admin/2fa/auth) has no
    # otp_device field and relies on django_otp automatically trying every
    # one of the user's devices when none is explicitly chosen. django-otp
    # 1.7.1 removed that fallback as a deliberate security fix (it used to
    # record a failed attempt against every non-matching device) and now
    # raises "Please select a device." instead -- breaking every login via
    # this form outright, before the submitted code is ever checked. Pin
    # below that until wagtail-2fa ships its own otp_device support (or
    # this project adds it). django-otp is a transitive dependency of
    # wagtail-2fa (no version pin of its own), so it silently floats to
    # newer releases on a fresh install without this.
    "django-otp<1.7.1",
    "django-allauth[socialaccount]>=65.18,<66.0",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "django-debug-toolbar",
    "factory-boy",
    "wagtail-factories",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
